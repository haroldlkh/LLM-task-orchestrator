name: Engine Logic

on:
  workflow_call:
    inputs:
      # The folder where the results will be saved
      output_folder_id:
        required: true
        type: string
      # The folder where the raw parquet files live
      source_folder_id:
        required: true
        type: string
      task_script:
        required: true
        type: string
      batch_size:
        default: "5"
        type: string
      data_type:
        default: "tabular"
        type: string
    secrets:
      GDRIVE_KEY:
        required: true

jobs:
  execute-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Engine Code
        uses: actions/checkout@v4
        with:
          repository: haroldlkh/LLM-task-orchestrator
          path: engine 

      - name: Checkout User Task Code
        uses: actions/checkout@v4
        with:
          path: user_repo 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python_version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requriements.txt 

      - name: Run Orchestrator
        env:
          GDRIVE_KEY: ${{ secrets.GDRIVE_KEY }}
          OUTPUT_FOLDER_ID: ${{ inputs.output_folder_id }}
          SOURCE_FOLDER_ID: ${{ inputs.source_folder_id }}
          TASK_SCRIPT: user_repo/${{ inputs.task_script }} 
          BATCH_SIZE: ${{ inputs.batch_size }}
          DATA_TYPE: ${{ inputs.data_type }}
          # NEW: Passing workflow metadata for naming
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          PYTHONPATH: ${{ github.workspace }}/engine/src
        run: |
          # Generate a timestamp in the runner
          echo "TIMESTAMP=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
          python engine/src/orchestrator.py