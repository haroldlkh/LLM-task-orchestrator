name: _Engine_Logic

on:
  workflow_call:
    # 1. These are "Public" inputs the user sends
    inputs:
      gdrive_folder_id:
        required: true
        type: string
      source_file_id:
        required: true
        type: string
    # 2. This is the "Private" secret the user sends
    secrets:
      GDRIVE_KEY:
        required: true

jobs:
  execute-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Engine Code
        uses: actions/checkout@v4
        # This ensures we are running YOUR engine code, not the user's
        with:
          repository: your-github-username/LLM-TASK-ORCHESTRATOR

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python_version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Orchestrator
        env:
          # We map the secrets/inputs to Environment Variables for Python
          GDRIVE_KEY: ${{ secrets.GDRIVE_KEY }}
          GDRIVE_FOLDER_ID: ${{ inputs.gdrive_folder_id }}
          SOURCE_FILE_ID: ${{ inputs.source_file_id }}
        run: python src/orchestrator.py