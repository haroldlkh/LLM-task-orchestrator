name: Engine Logic

on:
  workflow_call:
    inputs:
      user_requirements_file:
        required: false
        default: ""
        type: string
      source_connector:
        required: true
        type: string
      source_location:
        required: true
        type: string
      dest_connector:
        required: true
        type: string
      dest_location:
        required: true
        type: string
      task_script:
        required: false
        default: ""
        type: string
      pipeline_script:
        required: false
        default: ""
        type: string
      pipeline_name:
        required: false
        default: ""
        type: string
      batch_size:
        default: "5"
        type: string
    secrets:
      SOURCE_CONNECTOR_CONFIG_JSON:
        required: false
      DEST_CONNECTOR_CONFIG_JSON:
        required: false

jobs:
  execute-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Engine Code
        uses: actions/checkout@v4
        with:
          repository: haroldlkh/LLM-task-orchestrator
          path: engine

      - name: Checkout User Task Code
        uses: actions/checkout@v4
        with:
          path: user_repo

      - name: Validate entry inputs
        run: |
          if [ -n "${{ inputs.task_script }}" ] && [ -n "${{ inputs.pipeline_script }}" ]; then
            echo "Provide either task_script or pipeline_script, not both."
            exit 1
          fi

          if [ -z "${{ inputs.task_script }}" ] && [ -z "${{ inputs.pipeline_script }}" ]; then
            echo "You must provide one of: task_script or pipeline_script."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Install User Requirements
        if: ${{ inputs.user_requirements_file != '' }}
        run: |
          pip install -r user_repo/${{ inputs.user_requirements_file }}

      - name: Run Orchestrator
        env:
          SOURCE_CONNECTOR: ${{ inputs.source_connector }}
          SOURCE_LOCATION: ${{ inputs.source_location }}
          DEST_CONNECTOR: ${{ inputs.dest_connector }}
          DEST_LOCATION: ${{ inputs.dest_location }}
          SOURCE_CONNECTOR_CONFIG_JSON: ${{ secrets.SOURCE_CONNECTOR_CONFIG_JSON }}
          DEST_CONNECTOR_CONFIG_JSON: ${{ secrets.DEST_CONNECTOR_CONFIG_JSON }}
          TASK_SCRIPT: ${{ inputs.task_script }}
          PIPELINE_SCRIPT: ${{ inputs.pipeline_script }}
          PIPELINE_NAME: ${{ inputs.pipeline_name }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          PYTHONPATH: ${{ github.workspace }}/engine/src
        run: |
          if [ -n "${TASK_SCRIPT}" ]; then
            export TASK_SCRIPT="user_repo/${TASK_SCRIPT}"
          fi

          if [ -n "${PIPELINE_SCRIPT}" ]; then
            export PIPELINE_SCRIPT="user_repo/${PIPELINE_SCRIPT}"
          fi

          export TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          python engine/src/orchestrator.py