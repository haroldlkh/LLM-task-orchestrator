name: Engine Logic

on:
  workflow_call:
    inputs:
      output_folder_id:
        required: true
        type: string
      source_folder_id:
        required: true
        type: string
      task_script:
        required: false
        default: ""
        type: string
      task_scripts:
        required: false
        default: ""
        type: string
      pipeline_name:
        required: false
        default: ""
        type: string
      batch_size:
        default: "5"
        type: string
    secrets:
      GDRIVE_CLIENT_ID:
        required: true
      GDRIVE_CLIENT_SECRET:
        required: true
      GDRIVE_REFRESH_TOKEN:
        required: true

jobs:
  execute-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Engine Code
        uses: actions/checkout@v4
        with:
          repository: haroldlkh/LLM-task-orchestrator
          path: engine

      - name: Checkout User Task Code
        uses: actions/checkout@v4
        with:
          path: user_repo

      - name: Validate task inputs
        run: |
          if [ -n "${{ inputs.task_script }}" ] && [ -n "${{ inputs.task_scripts }}" ]; then
            echo "Provide either task_script or task_scripts, not both."
            exit 1
          fi

          if [ -z "${{ inputs.task_script }}" ] && [ -z "${{ inputs.task_scripts }}" ]; then
            echo "You must provide one of: task_script or task_scripts."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Run Orchestrator
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          OUTPUT_FOLDER_ID: ${{ inputs.output_folder_id }}
          SOURCE_FOLDER_ID: ${{ inputs.source_folder_id }}
          TASK_SCRIPT: ${{ inputs.task_script }}
          TASK_SCRIPTS: ${{ inputs.task_scripts }}
          PIPELINE_NAME: ${{ inputs.pipeline_name }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          PYTHONPATH: ${{ github.workspace }}/engine/src
        run: |
          if [ -n "${TASK_SCRIPT}" ]; then
            export TASK_SCRIPT="user_repo/${TASK_SCRIPT}"
          fi

          if [ -n "${TASK_SCRIPTS}" ]; then
            export TASK_SCRIPTS=$(echo "${TASK_SCRIPTS}" | sed 's|^|user_repo/|' | sed 's|,|,user_repo/|g')
          fi

          export TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          python engine/src/orchestrator.py